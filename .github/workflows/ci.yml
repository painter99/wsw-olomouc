name: CI

on:
  push:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build_output.txt

      - name: Build debug APK
        run: ./gradlew assembleDebug 2>&1 | tee apk_build_output.txt

      - name: Emit failure details as annotations
        if: failure()
        run: |
          python3 .github/ci_failure_report.py build_output.txt app/build/test-results/testDebugUnitTest || true
          python3 .github/ci_failure_report.py apk_build_output.txt app/build/test-results/testDebugUnitTest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wsw-olomouc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
